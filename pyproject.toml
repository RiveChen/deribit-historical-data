[project]
name = "deribit-fetcher"
version = "0.1.0"
description = "Fetching Deribit historical trades(transactions) via Deribit Historical API."
readme = "README.md"
authors = [
    { name = "RiveChen", email = "155357736+RiveChen@users.noreply.github.com" },
]
requires-python = ">=3.10"
dependencies = [
    "tqdm",
    "tenacity",
    "aiosqlite>=0.22.1",
    "httpx[socks]>=0.28.1",
    "orjson>=3.11.7",
    "aiolimiter>=1.2.1",
    "polars>=1.38.0",
    "pyarrow>=23.0.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
